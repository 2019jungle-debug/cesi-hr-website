<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 求職者履歷健檢 · 策識永續</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy-deep:#07142f;--navy:#10244c;--teal:#1d756f;--gold:#c9a15d;--gold-bright:#e2bf79;--ivory:#fbf8ef;--ink:#182036;--ink-soft:#5a6377;--ink-faded:#8b94a7;--line:rgba(16,36,76,0.12);--danger:#c34646;--warning:#d4861a}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--ivory);color:var(--ink);min-height:100vh}
a{text-decoration:none}
nav{background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);padding:14px clamp(20px,4vw,60px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(16,36,76,.07)}
.nav-brand{display:flex;align-items:center;gap:10px}.nav-brand img{height:40px}
.nav-brand span{font-family:'Noto Serif TC',serif;font-size:14px;font-weight:700;color:var(--navy)}
.nav-back{color:var(--ink-soft);font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid var(--line);transition:all .2s}
.nav-back:hover{background:var(--navy);color:#fff}
.page-header{background:linear-gradient(135deg,#1a3d2b,var(--teal),#0f4a42);padding:48px clamp(20px,4vw,60px) 44px;text-align:center}
.tool-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(226,191,121,.15);border:1px solid rgba(226,191,121,.3);border-radius:999px;padding:5px 16px;font-size:12px;color:var(--gold-bright);font-weight:600;margin-bottom:16px}
.page-header h1{font-family:'Noto Serif TC',serif;font-size:clamp(22px,3.5vw,38px);font-weight:900;color:#fff;margin-bottom:10px}
.page-header p{color:rgba(255,255,255,.75);font-size:15px;max-width:520px;margin:0 auto}
.main{max-width:780px;margin:0 auto;padding:40px clamp(20px,4vw,40px) 80px}
.form-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:18px}
.form-card h2{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;color:var(--navy);margin-bottom:4px}
.form-card p{font-size:13px;color:var(--ink-soft);margin-bottom:18px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:14px;color:var(--ink);background:#fff;transition:border-color .2s;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--teal)}
.char-count{font-size:11px;color:var(--ink-faded);text-align:right;margin-top:4px}
.btn-analyze{width:100%;background:var(--teal);color:#fff;border:none;padding:14px;border-radius:8px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s}
.btn-analyze:hover:not(:disabled){background:#155e59}
.btn-analyze:disabled{opacity:.4;cursor:not-allowed}
#result-section{display:none}
.score-head{background:linear-gradient(135deg,#1a3d2b,var(--teal));border-radius:14px;padding:28px;text-align:center;margin-bottom:18px}
.score-head h2{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:900;color:#fff;margin-bottom:6px}
.overall-score{font-size:56px;font-weight:900;color:#fff;line-height:1}
.overall-label{font-size:14px;color:rgba(255,255,255,.75);margin-top:6px}
.score-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.score-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.sc-name{font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.sc-bar{height:7px;background:rgba(16,36,76,.07);border-radius:999px;overflow:hidden;margin-bottom:6px}
.sc-fill{height:100%;border-radius:999px;background:var(--teal);transition:width .8s ease}
.sc-num{font-size:20px;font-weight:800;color:var(--navy)}
.ai-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:18px}
.ai-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ai-icon{width:34px;height:34px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.ai-title{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:700;color:var(--navy)}
.ai-body{font-size:14px;color:var(--ink);line-height:2;white-space:pre-wrap;min-height:60px}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing span{width:6px;height:6px;background:var(--navy);border-radius:50%;animation:bounce .9s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
.cta-box{background:linear-gradient(135deg,var(--navy-deep),var(--navy));border-radius:12px;padding:24px;text-align:center}
.cta-box h3{font-family:'Noto Serif TC',serif;font-size:17px;color:#fff;font-weight:800;margin-bottom:6px}
.cta-box p{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:16px}
.cta-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-gold{background:var(--gold-bright);color:var(--navy-deep);padding:10px 22px;border-radius:8px;font-weight:800;font-size:14px}
.btn-ghost{border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.85);padding:10px 18px;border-radius:8px;font-size:13px}
.btn-restart{display:block;margin:14px auto 0;background:#fff;border:2px solid var(--line);color:var(--ink);padding:10px 22px;border-radius:8px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<nav>
  <a href="hr-health-center.html" class="nav-brand">
    <img src="assets/logo.png" alt="策識永續">
    <span>AI 人資健檢中心</span>
  </a>
  <a href="hr-health-center.html" class="nav-back">← 回健檢中心</a>
</nav>
<div class="page-header">
  <div class="tool-badge">📄 No.05 · AI 求職者履歷健檢</div>
  <h1>AI 履歷診斷報告</h1>
  <p>貼入履歷內容，AI 評估完整度、面試風險與表達品質</p>
</div>
<div class="main">
  <div id="form-section">
    <div class="form-card">
      <h2>貼入您的履歷內容</h2>
      <p>請貼上履歷全文，包含個人資料（可去識別化）、學歷、工作經歷、技能與自我介紹</p>
      <div class="field">
        <label>應徵職位（選填）</label>
        <input type="text" id="position" placeholder="例：人資專員、行銷企劃、軟體工程師">
      </div>
      <div class="field">
        <label>履歷內容</label>
        <textarea id="resume-text" rows="14" placeholder="請將您的履歷內容貼入此處...

建議包含：
・基本資料（可匿名化）
・學歷背景
・工作經歷（含年資、公司、職稱、主要職責）
・技能與專長
・自我介紹"></textarea>
        <div class="char-count" id="char-count">0 字</div>
      </div>
      <button class="btn-analyze" id="btn-analyze" onclick="analyze()" disabled>🔍 開始 AI 履歷分析</button>
    </div>
  </div>

  <div id="result-section">
    <div class="score-head">
      <h2>履歷健檢報告</h2>
      <div class="overall-score" id="overall-score">—</div>
      <div class="overall-label">綜合履歷分數（滿分 100）</div>
    </div>
    <div class="score-grid" id="score-grid"></div>
    <div class="ai-box">
      <div class="ai-head">
        <div class="ai-icon">🤖</div>
        <div class="ai-title">AI 詳細履歷診斷報告</div>
      </div>
      <div class="ai-body" id="ai-body"><div class="typing"><span></span><span></span><span></span></div></div>
    </div>
    <div class="cta-box">
      <h3>想讓履歷更有競爭力？</h3>
      <p>策識永續提供履歷優化、面試準備與職涯諮詢服務</p>
      <div class="cta-row">
        <a href="ai-hr-consultant.html" class="btn-gold">免費諮詢 AI 顧問</a>
        <a href="pricing-and-booking.html" class="btn-ghost">顧問服務方案</a>
      </div>
    </div>
    <button class="btn-restart" onclick="restart()">重新分析</button>
  </div>
</div>

<script>
const API = 'https://cesi-hr-api-626216288020.asia-east1.run.app';
const SESSION = 'hc5-' + Math.random().toString(36).slice(2);

const textarea = document.getElementById('resume-text');
textarea.addEventListener('input', () => {
  const len = textarea.value.length;
  document.getElementById('char-count').textContent = len + ' 字';
  document.getElementById('btn-analyze').disabled = len < 50;
});

function analyze() {
  const resumeText = textarea.value.trim();
  const position = document.getElementById('position').value.trim();
  if(resumeText.length < 50) return;

  HCLead.gate('tool-05', 'AI 求職者履歷健檢', {}, async function() {
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    const dimensions = ['內容完整度','工作經歷表達','技能匹配度','版面與格式','整體印象'];
    const grid = document.getElementById('score-grid');
    grid.innerHTML = '';
    dimensions.forEach(d => {
      const card = document.createElement('div');
      card.className = 'score-card';
      card.innerHTML = '<div class="sc-name">'+d+'</div><div class="sc-bar"><div class="sc-fill" id="bar-'+d+'" style="width:0%"></div></div><div class="sc-num" id="num-'+d+'">—</div>';
      grid.appendChild(card);
    });

    const prompt = '你是資深人資顧問，請分析以下求職者的履歷，給出詳細的健檢報告。\n\n'
      + (position ? '應徵職位：'+position+'\n' : '')
      + '履歷內容：\n' + resumeText
      + '\n\n請以 JSON 格式回覆，格式如下（之後加上詳細文字分析）：\n'
      + '{"overall":75,"scores":{"內容完整度":80,"工作經歷表達":70,"技能匹配度":75,"版面與格式":72,"整體印象":78}}\n\n'
      + '然後換行開始詳細文字分析，包含：\n'
      + '1. 履歷優勢亮點（3點）\n2. 需要改善的問題（3-5點，具體說明）\n'
      + '3. 針對每個問題的具體修改建議\n4. 面試官可能追問的問題預測\n5. 提升競爭力的行動建議\n\n'
      + '請用繁體中文，語氣專業友善，約 500-600 字。';

    const aiBody = document.getElementById('ai-body');
    aiBody.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

    try {
      const res = await fetch(API+'/api/hr-health-check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: prompt, sessionId: SESSION })
      });
      if(!res.ok || !res.body) throw new Error('API error');
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let txt = '';
      aiBody.textContent = '';
      while(true) {
        const {done, value} = await reader.read();
        if(done) break;
        const chunk = decoder.decode(value, {stream:true});
        for(const line of chunk.split('\n')) {
          if(line.startsWith('data:')) {
            const d = line.slice(5).trim();
            if(d === '[DONE]') break;
            try { const t=JSON.parse(d).choices?.[0]?.delta?.content||''; txt+=t; aiBody.textContent=txt; } catch(e){}
          }
        }
      }

      try {
        const match = txt.match(/\{[\s\S]*?"overall"[\s\S]*?\}/);
        if(match) {
          const data = JSON.parse(match[0]);
          document.getElementById('overall-score').textContent = data.overall || '—';
          if(data.scores) {
            Object.entries(data.scores).forEach(([k,v]) => {
              const bar = document.getElementById('bar-'+k);
              const num = document.getElementById('num-'+k);
              if(bar) bar.style.width = v+'%';
              if(num) num.textContent = v;
            });
          }
          aiBody.textContent = txt.replace(/^\{[^}]*\}\n?/,'').trim();
        }
      } catch(e){}

      HCLead.reportDone(txt.replace(/^\{[^}]*\}\n?/,'').trim());
    } catch(e) {
      aiBody.textContent = 'AI 分析暫時無法取得，請稍後再試。';
    }
  });
}

function restart() {
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('form-section').style.display = 'block';
  textarea.value = '';
  document.getElementById('char-count').textContent = '0 字';
  document.getElementById('btn-analyze').disabled = true;
}
</script>
<script src="assets/hc-lead.js"></script>
</body>
</html>
