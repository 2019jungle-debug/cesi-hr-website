<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 面試模擬訓練 · 策識永續</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy-deep:#07142f;--navy:#10244c;--teal:#1d756f;--gold:#c9a15d;--gold-bright:#e2bf79;--ivory:#fbf8ef;--ink:#182036;--ink-soft:#5a6377;--ink-faded:#8b94a7;--line:rgba(16,36,76,0.12);--danger:#c34646}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--ivory);color:var(--ink);min-height:100vh}
a{text-decoration:none}
nav{background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);padding:14px clamp(20px,4vw,60px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(16,36,76,.07)}
.nav-brand{display:flex;align-items:center;gap:10px}.nav-brand img{height:40px}
.nav-brand span{font-family:'Noto Serif TC',serif;font-size:14px;font-weight:700;color:var(--navy)}
.nav-back{color:var(--ink-soft);font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid var(--line);transition:all .2s}
.nav-back:hover{background:var(--navy);color:#fff}
.page-header{background:linear-gradient(135deg,#1e0a3c,#3d1a6e,var(--navy));padding:48px clamp(20px,4vw,60px) 44px;text-align:center}
.tool-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(226,191,121,.15);border:1px solid rgba(226,191,121,.3);border-radius:999px;padding:5px 16px;font-size:12px;color:var(--gold-bright);font-weight:600;margin-bottom:16px}
.page-header h1{font-family:'Noto Serif TC',serif;font-size:clamp(22px,3.5vw,38px);font-weight:900;color:#fff;margin-bottom:10px}
.page-header p{color:rgba(255,255,255,.75);font-size:15px;max-width:540px;margin:0 auto}
.main{max-width:780px;margin:0 auto;padding:40px clamp(20px,4vw,40px) 80px}
.form-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:18px}
.form-card h2{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;color:var(--navy);margin-bottom:4px}
.form-card p{font-size:13px;color:var(--ink-soft);margin-bottom:18px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:14px;color:var(--ink);background:#fff;transition:border-color .2s;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:#3d1a6e}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.q-count-row{display:flex;gap:10px;flex-wrap:wrap}
.q-chip{padding:8px 16px;border:2px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-soft);transition:all .2s;user-select:none}
.q-chip.on{border-color:#3d1a6e;color:#3d1a6e;background:rgba(61,26,110,.05)}
.btn-start{width:100%;background:linear-gradient(135deg,#3d1a6e,var(--navy));color:#fff;border:none;padding:14px;border-radius:8px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn-start:hover:not(:disabled){opacity:.85}
.btn-start:disabled{opacity:.4;cursor:not-allowed}
#sim-section{display:none}
#result-section{display:none}
.q-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:16px}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-badge{font-size:11px;font-weight:800;color:#3d1a6e;background:rgba(61,26,110,.08);padding:3px 10px;border-radius:999px}
.q-num-txt{font-size:12px;color:var(--ink-faded)}
.q-text{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;color:var(--navy);line-height:1.65;margin-bottom:16px}
.ans-field{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:14px;color:var(--ink);resize:vertical;transition:border-color .2s}
.ans-field:focus{outline:none;border-color:#3d1a6e}
.nav-btns{display:flex;justify-content:space-between;gap:12px;margin-top:14px}
.btn-prev{background:#fff;border:2px solid var(--line);color:var(--ink-soft);padding:10px 20px;border-radius:8px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn-prev:disabled{opacity:.35;cursor:not-allowed}
.btn-next{background:var(--navy);color:#fff;padding:10px 24px;border-radius:8px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:none}
.btn-submit{background:linear-gradient(135deg,#3d1a6e,var(--navy));color:#fff;padding:10px 24px;border-radius:8px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:none}
.prog-bar-wrap{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.prog-bar{flex:1;height:6px;background:rgba(16,36,76,.08);border-radius:999px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#3d1a6e,var(--gold));border-radius:999px;transition:width .4s}
.prog-txt{font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap}
.result-header{background:linear-gradient(135deg,#1e0a3c,#3d1a6e);border-radius:14px;padding:32px;text-align:center;margin-bottom:18px}
.result-header h2{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:900;color:#fff;margin-bottom:8px}
.result-score{font-size:64px;font-weight:900;color:var(--gold-bright);line-height:1}
.result-level{font-size:14px;color:var(--gold-bright);margin-top:8px;font-weight:700}
.ai-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:18px}
.ai-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ai-icon{width:34px;height:34px;background:#3d1a6e;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.ai-title{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:700;color:var(--navy)}
.ai-body{font-size:14px;color:var(--ink);line-height:2;white-space:pre-wrap;min-height:60px}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing span{width:6px;height:6px;background:var(--navy);border-radius:50%;animation:bounce .9s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
.cta-box{background:linear-gradient(135deg,var(--navy-deep),var(--navy));border-radius:12px;padding:24px;text-align:center}
.cta-box h3{font-family:'Noto Serif TC',serif;font-size:17px;color:#fff;font-weight:800;margin-bottom:6px}
.cta-box p{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:16px}
.cta-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-gold{background:var(--gold-bright);color:var(--navy-deep);padding:10px 22px;border-radius:8px;font-weight:800;font-size:14px}
.btn-ghost{border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.85);padding:10px 18px;border-radius:8px;font-size:13px}
.btn-restart{display:block;margin:14px auto 0;background:#fff;border:2px solid var(--line);color:var(--ink);padding:10px 22px;border-radius:8px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <a href="hr-health-center.html" class="nav-brand">
    <img src="assets/logo.png" alt="策識永續">
    <span>AI 人資健檢中心</span>
  </a>
  <a href="hr-health-center.html" class="nav-back">← 回健檢中心</a>
</nav>
<div class="page-header">
  <div class="tool-badge">🎯 No.06 · AI 面試模擬訓練</div>
  <h1>AI 面試官模擬實戰</h1>
  <p>輸入應徵職位與背景，AI 扮演面試官出題，即時評分反饋</p>
</div>
<div class="main">
  <div id="form-section">
    <div class="form-card">
      <h2>設定面試情境</h2>
      <p>填寫越詳細，AI 面試官出的題目越貼近真實情境</p>
      <div class="row2">
        <div class="field">
          <label>應徵職位 *</label>
          <input type="text" id="inp-position" placeholder="例：人資專員" oninput="checkReady()">
        </div>
        <div class="field">
          <label>產業別</label>
          <select id="inp-industry">
            <option value="">請選擇</option>
            <option>科技／軟體</option><option>製造業</option><option>金融／保險</option>
            <option>零售／電商</option><option>醫療／生技</option><option>餐飲／服務</option>
            <option>教育／培訓</option><option>顧問／專業服務</option><option>其他</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>您的工作年資與背景（選填）</label>
        <textarea id="inp-background" rows="4" placeholder="例：3 年行銷經驗，熟悉數位廣告，曾帶領 2 人小組..."></textarea>
      </div>
      <div class="field">
        <label>面試題數</label>
        <div class="q-count-row" id="q-count-row">
          <div class="q-chip on" onclick="setCount(this,3)">3 題（快速）</div>
          <div class="q-chip" onclick="setCount(this,5)">5 題（標準）</div>
          <div class="q-chip" onclick="setCount(this,8)">8 題（深度）</div>
        </div>
      </div>
      <button class="btn-start" id="btn-start" onclick="startSim()" disabled>🎯 開始模擬面試</button>
    </div>
  </div>

  <div id="sim-section">
    <div class="prog-bar-wrap">
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="prog-txt" id="prog-txt">第 1 / 3 題</div>
    </div>
    <div id="questions-container"></div>
    <div class="nav-btns">
      <button class="btn-prev" id="btn-prev" onclick="prevQ()" disabled>← 上一題</button>
      <button class="btn-next" id="btn-next" onclick="nextQ()">下一題 →</button>
    </div>
  </div>

  <div id="result-section">
    <div class="result-header">
      <h2>面試模擬評分報告</h2>
      <div class="result-score" id="result-score">—</div>
      <div class="result-level" id="result-level"></div>
    </div>
    <div class="ai-box">
      <div class="ai-head">
        <div class="ai-icon">🤖</div>
        <div class="ai-title">AI 面試官詳細反饋</div>
      </div>
      <div class="ai-body" id="ai-body"><div class="typing"><span></span><span></span><span></span></div></div>
    </div>
    <div class="cta-box">
      <h3>想提升面試表現？</h3>
      <p>策識永續提供一對一面試輔導與職涯諮詢服務</p>
      <div class="cta-row">
        <a href="ai-hr-consultant.html" class="btn-gold">免費諮詢 AI 顧問</a>
        <a href="pricing-and-booking.html" class="btn-ghost">顧問服務方案</a>
      </div>
    </div>
    <button class="btn-restart" onclick="restart()">再次模擬</button>
  </div>
</div>

<script>
const API = 'https://cesi-hr-api-626216288020.asia-east1.run.app';
const SESSION = 'hc6-' + Math.random().toString(36).slice(2);

let qCount = 3;
let questions = [];
let answers = [];
let curQ = 0;

function setCount(el, n) {
  document.querySelectorAll('.q-chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  qCount = n;
}

function checkReady() {
  document.getElementById('btn-start').disabled = !document.getElementById('inp-position').value.trim();
}

async function startSim() {
  const position = document.getElementById('inp-position').value.trim();
  const industry = document.getElementById('inp-industry').value;
  const background = document.getElementById('inp-background').value.trim();

  HCLead.gate('tool-06', 'AI 面試模擬訓練', {}, async function() {
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('sim-section').style.display = 'block';

    const genPrompt = `你是專業的人資面試官，請針對以下應徵者產生 ${qCount} 道面試題目。

應徵職位：${position}
${industry ? `產業：${industry}` : ''}
${background ? `應徵者背景：${background}` : ''}

請以 JSON 陣列格式回覆，每題包含 type（題型）和 question（問題）：
[{"type":"自我介紹","question":"..."},{"type":"行為面試","question":"..."},...]

題型選擇：自我介紹、行為面試（STAR法則）、情境題、動機與價值觀、專業能力、壓力測試

只回覆 JSON，不要其他文字。`;

    const container = document.getElementById('questions-container');
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--ink-soft)">AI 正在產生面試題目...</div>';

    try {
      const res = await fetch(`${API}/api/hr-health-check`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: genPrompt, sessionId: SESSION + '-gen' })
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let raw = '';
      while(true) {
        const {done, value} = await reader.read();
        if(done) break;
        const chunk = decoder.decode(value, {stream:true});
        for(const line of chunk.split('\n')) {
          if(line.startsWith('data:')) {
            const d = line.slice(5).trim();
            if(d === '[DONE]') break;
            try { raw += JSON.parse(d).choices?.[0]?.delta?.content || ''; } catch(e) {}
          }
        }
      }

      const match = raw.match(/\[[\s\S]*\]/);
      if(match) questions = JSON.parse(match[0]);
      else questions = Array.from({length:qCount},(_,i)=>({type:'行為面試',question:`請描述一個您在工作中遇到的挑戰，以及如何克服它？（題 ${i+1}）`}));
    } catch(e) {
      questions = Array.from({length:qCount},(_,i)=>({type:'行為面試',question:`請描述一個您曾經成功完成的重要專案，說明您的角色與貢獻。（題 ${i+1}）`}));
    }

    answers = new Array(questions.length).fill('');
    curQ = 0;
    renderQ();
  });
}

function renderQ() {
  const q = questions[curQ];
  const total = questions.length;
  document.getElementById('prog-fill').style.width = ((curQ+1)/total*100)+'%';
  document.getElementById('prog-txt').textContent = `第 ${curQ+1} / ${total} 題`;

  const container = document.getElementById('questions-container');
  container.innerHTML = `
    <div class="q-card">
      <div class="q-meta">
        <span class="q-badge">${q.type}</span>
        <span class="q-num-txt">第 ${curQ+1} 題，共 ${total} 題</span>
      </div>
      <div class="q-text">${q.question}</div>
      <textarea class="ans-field" id="cur-answer" rows="6" placeholder="請在此輸入您的回答...">${answers[curQ]}</textarea>
    </div>`;

  document.getElementById('btn-prev').disabled = curQ === 0;
  const nextBtn = document.getElementById('btn-next');
  if(curQ === total-1) {
    nextBtn.textContent = '提交評分 →';
    nextBtn.className = 'btn-submit';
  } else {
    nextBtn.textContent = '下一題 →';
    nextBtn.className = 'btn-next';
  }
}

function saveAnswer() {
  const el = document.getElementById('cur-answer');
  if(el) answers[curQ] = el.value;
}

function prevQ() { saveAnswer(); if(curQ>0){curQ--;renderQ();} }

function nextQ() {
  saveAnswer();
  if(curQ < questions.length-1) { curQ++; renderQ(); }
  else evaluate();
}

async function evaluate() {
  document.getElementById('sim-section').style.display = 'none';
  document.getElementById('result-section').style.display = 'block';

  const qas = questions.map((q,i)=>`【第${i+1}題 - ${q.type}】\n問題：${q.question}\n回答：${answers[i]||'（未作答）'}`).join('\n\n');

  const prompt = `你是資深人資面試官，請根據以下模擬面試的問答，給出詳細的評分與反饋。

${qas}

請先給出整體分數（0-100），以 JSON 格式：{"score":75}
然後換行開始詳細反饋，包含：
1. 整體表現評估
2. 每道題目的回答分析（優點與待改進處）
3. 表達技巧建議（STAR法則應用、邏輯結構等）
4. 面試技巧提升建議

請用繁體中文，約 500-600 字。`;

  const aiBody = document.getElementById('ai-body');

  try {
    const res = await fetch(`${API}/api/hr-health-check`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: prompt, sessionId: SESSION + '-eval' })
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let txt = '';
    aiBody.textContent = '';
    while(true) {
      const {done, value} = await reader.read();
      if(done) break;
      for(const line of decoder.decode(value,{stream:true}).split('\n')) {
        if(line.startsWith('data:')) {
          const d = line.slice(5).trim();
          if(d==='[DONE]') break;
          try { const t=JSON.parse(d).choices?.[0]?.delta?.content||''; txt+=t; aiBody.textContent=txt; } catch(e){}
        }
      }
    }

    try {
      const m = txt.match(/\{"score":\s*(\d+)\}/);
      if(m) {
        const score = parseInt(m[1]);
        document.getElementById('result-score').textContent = score;
        document.getElementById('result-level').textContent = score>=80?'優秀（強烈推薦）':score>=65?'良好（建議錄取）':score>=50?'普通（可再考慮）':'需加強（建議練習）';
        aiBody.textContent = txt.replace(/^\{[^}]*\}\n?/, '').trim();
      }
    } catch(e){}

    HCLead.reportDone(txt.replace(/^\{[^}]*\}\n?/,'').trim());
  } catch(e) {
    aiBody.textContent = 'AI 評分暫時無法取得，請稍後再試。';
  }
}

function restart() {
  questions=[]; answers=[]; curQ=0;
  document.getElementById('result-section').style.display='none';
  document.getElementById('form-section').style.display='block';
}
</script>
<script src="assets/hc-lead.js"></script>
</body>
</html>
