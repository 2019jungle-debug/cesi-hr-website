<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 招募文案生成器 · 策識永續</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy-deep:#07142f;--navy:#10244c;--teal:#1d756f;--gold:#c9a15d;--gold-bright:#e2bf79;--ivory:#fbf8ef;--ink:#182036;--ink-soft:#5a6377;--ink-faded:#8b94a7;--line:rgba(16,36,76,0.12);--danger:#c34646}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--ivory);color:var(--ink);min-height:100vh}
a{text-decoration:none}
nav{background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);padding:14px clamp(20px,4vw,60px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(16,36,76,.07)}
.nav-brand{display:flex;align-items:center;gap:10px}.nav-brand img{height:40px}
.nav-brand span{font-family:'Noto Serif TC',serif;font-size:14px;font-weight:700;color:var(--navy)}
.nav-back{color:var(--ink-soft);font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid var(--line);transition:all .2s}
.nav-back:hover{background:var(--navy);color:#fff}
.page-header{background:linear-gradient(135deg,#0a1f3a,var(--navy),#0f3560);padding:48px clamp(20px,4vw,60px) 44px;text-align:center}
.tool-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(226,191,121,.15);border:1px solid rgba(226,191,121,.3);border-radius:999px;padding:5px 16px;font-size:12px;color:var(--gold-bright);font-weight:600;margin-bottom:16px}
.page-header h1{font-family:'Noto Serif TC',serif;font-size:clamp(22px,3.5vw,38px);font-weight:900;color:#fff;margin-bottom:10px}
.page-header p{color:rgba(255,255,255,.75);font-size:15px;max-width:540px;margin:0 auto}
.main{max-width:820px;margin:0 auto;padding:40px clamp(20px,4vw,40px) 80px}
.form-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:18px}
.form-card h2{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:700;color:var(--navy);margin-bottom:4px}
.form-card p{font-size:13px;color:var(--ink-soft);margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:14px;color:var(--ink);background:#fff;transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.platform-row{display:flex;gap:10px;flex-wrap:wrap}
.platform-chip{display:flex;align-items:center;gap:6px;padding:9px 16px;border:2px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink-soft);transition:all .2s;user-select:none}
.platform-chip:hover{border-color:var(--gold)}
.platform-chip.on{color:var(--navy);border-color:var(--navy);background:rgba(16,36,76,.04)}
.chip-dot{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;position:relative;transition:all .2s}
.platform-chip.on .chip-dot{background:var(--navy);border-color:var(--navy)}
.btn-gen{width:100%;background:var(--navy);color:#fff;border:none;padding:14px;border-radius:8px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .2s}
.btn-gen:hover:not(:disabled){background:var(--teal)}
.btn-gen:disabled{opacity:.4;cursor:not-allowed}
#result-section{display:none}
.tabs{display:flex;gap:0;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{padding:10px 18px;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
.tab.active{color:var(--navy);border-bottom-color:var(--navy)}
.panels{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;margin-bottom:18px}
.panel{display:none;padding:24px}
.panel.active{display:block}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-title{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:700;color:var(--navy)}
.btn-copy{background:rgba(16,36,76,.06);border:1px solid var(--line);color:var(--navy);padding:6px 14px;border-radius:6px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-copy:hover{background:var(--navy);color:#fff}
.panel-body{font-size:14px;color:var(--ink);line-height:2;white-space:pre-wrap;min-height:80px}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing span{width:6px;height:6px;background:var(--navy);border-radius:50%;animation:bounce .9s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
.cta-box{background:linear-gradient(135deg,var(--navy-deep),var(--navy));border-radius:12px;padding:24px;text-align:center}
.cta-box h3{font-family:'Noto Serif TC',serif;font-size:17px;color:#fff;font-weight:800;margin-bottom:6px}
.cta-box p{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:16px}
.cta-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-gold{background:var(--gold-bright);color:var(--navy-deep);padding:10px 22px;border-radius:8px;font-weight:800;font-size:14px}
.btn-ghost{border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.85);padding:10px 18px;border-radius:8px;font-size:13px}
.btn-restart{display:block;margin:14px auto 0;background:#fff;border:2px solid var(--line);color:var(--ink);padding:10px 22px;border-radius:8px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.limit-msg{background:#fff0f0;border:1px solid #f5c0c0;border-radius:8px;padding:14px 18px;color:var(--danger);font-size:14px;text-align:center;line-height:1.7}
@media(max-width:560px){.row2,.row3{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <a href="hr-health-center.html" class="nav-brand">
    <img src="assets/logo.png" alt="策識永續">
    <span>AI 人資健檢中心</span>
  </a>
  <a href="hr-health-center.html" class="nav-back">← 回健檢中心</a>
</nav>
<div class="page-header">
  <div class="tool-badge">📢 No.08 · AI 招募文案生成器</div>
  <h1>AI 招募文案一鍵生成</h1>
  <p>針對 104、111、LinkedIn 等平台特性，生成吸引人才的招募文案</p>
</div>
<div class="main">
  <div id="form-section">
    <div class="form-card">
      <h2>填寫職缺資料</h2>
      <p>填寫越詳細，文案效果越好，說服力越強</p>
      <div class="row2">
        <div class="field">
          <label>職位名稱 *</label>
          <input type="text" id="inp-title" placeholder="例：資深行銷企劃" oninput="checkReady()">
        </div>
        <div class="field">
          <label>公司名稱</label>
          <input type="text" id="inp-company" placeholder="例：策識永續股份有限公司">
        </div>
      </div>
      <div class="row3">
        <div class="field">
          <label>產業別</label>
          <select id="inp-industry">
            <option value="">請選擇</option>
            <option>科技／軟體</option><option>製造業</option><option>金融／保險</option>
            <option>零售／電商</option><option>醫療／生技</option><option>餐飲／服務</option>
            <option>教育／培訓</option><option>顧問／專業服務</option><option>其他</option>
          </select>
        </div>
        <div class="field">
          <label>薪資範圍</label>
          <input type="text" id="inp-salary" placeholder="例：月薪 40,000-60,000">
        </div>
        <div class="field">
          <label>工作地點</label>
          <input type="text" id="inp-location" placeholder="例：台北市信義區">
        </div>
      </div>
      <div class="field">
        <label>公司特色與文化（選填）</label>
        <textarea id="inp-culture" rows="3" placeholder="例：彈性工時、遠端辦公、團隊年輕有活力、重視員工成長..."></textarea>
      </div>
      <div class="field">
        <label>主要職責（選填）</label>
        <textarea id="inp-duties" rows="3" placeholder="例：負責品牌社群內容規劃、廣告投放優化、數據分析報告..."></textarea>
      </div>
      <div class="field">
        <label>選擇發布平台</label>
        <div class="platform-row">
          <div class="platform-chip on" data-p="104" onclick="togglePlatform(this)"><div class="chip-dot"></div>104 人力銀行</div>
          <div class="platform-chip on" data-p="111" onclick="togglePlatform(this)"><div class="chip-dot"></div>1111 人力銀行</div>
          <div class="platform-chip" data-p="LinkedIn" onclick="togglePlatform(this)"><div class="chip-dot"></div>LinkedIn</div>
          <div class="platform-chip" data-p="社群" onclick="togglePlatform(this)"><div class="chip-dot"></div>社群媒體</div>
        </div>
      </div>
      <button class="btn-gen" id="btn-gen" onclick="generate()" disabled>🚀 生成招募文案</button>
    </div>
  </div>

  <div id="result-section">
    <div class="tabs" id="tabs"></div>
    <div class="panels" id="panels"></div>
    <div class="cta-box">
      <h3>需要完整的招募策略規劃？</h3>
      <p>策識永續提供招募流程設計、雇主品牌建立與人才吸引策略服務</p>
      <div class="cta-row">
        <a href="ai-hr-consultant.html" class="btn-gold">免費諮詢 AI 顧問</a>
        <a href="pricing-and-booking.html" class="btn-ghost">顧問服務方案</a>
      </div>
    </div>
    <button class="btn-restart" onclick="restart()">重新生成</button>
  </div>
</div>

<script>
const API = 'https://cesi-hr-api-626216288020.asia-east1.run.app';
const SESSION = 'hc8-' + Math.random().toString(36).slice(2);

function togglePlatform(el) {
  el.classList.toggle('on');
  checkReady();
}

function checkReady() {
  const hasTitle = document.getElementById('inp-title').value.trim();
  const hasPlatform = document.querySelectorAll('.platform-chip.on').length > 0;
  document.getElementById('btn-gen').disabled = !(hasTitle && hasPlatform);
}

const PLATFORM_PROMPTS = {
  '104': (info) => `請為 104 人力銀行撰寫一份吸引人才的職缺說明，符合 104 平台用戶習慣（台灣求職者，重視穩定性與發展）。

${info}

請包含：
1. 吸引眼球的職缺標題（1-2個備選）
2. 公司簡介（2-3句，突出優勢）
3. 工作內容（條列式，6-8項）
4. 職位要求（必要條件3-5項、加分條件2-3項）
5. 公司福利（8-10項）
6. 應徵說明

用繁體中文，語氣親切專業，約 400-500 字。`,

  '111': (info) => `請為 1111 人力銀行撰寫職缺說明，著重清楚條列與具體描述。

${info}

請包含：
1. 職缺標題
2. 工作內容（詳細條列，8-10項）
3. 職位需求（學歷、經歷、技能）
4. 待遇福利（薪資範圍、各項福利）
5. 工作環境說明

用繁體中文，清楚直接，約 350-400 字。`,

  'LinkedIn': (info) => `請為 LinkedIn 撰寫一份高質感的職缺說明，目標是吸引有一定工作經驗的專業人才。

${info}

請包含：
1. 吸引人的開場段落（突出機會與影響力）
2. About the Role（英文＋中文對照）
3. What You'll Do（英文＋中文條列）
4. What We're Looking For（英文＋中文條列）
5. Why Join Us（公司文化與福利亮點）

語氣專業且充滿活力，中英夾雜，約 400 字。`,

  '社群': (info) => `請撰寫適合在 Facebook、Instagram、LinkedIn 貼文分享的招募文案，要有吸引力且適合社群傳播。

${info}

請提供 2 個版本：
版本 A：Facebook 長文（300字左右，正式但有溫度）
版本 B：Instagram 短文（150字內＋適合的 hashtag）

文案要吸睛、有人情味，讓員工願意分享轉發。`
};

async function generate() {
  const title = document.getElementById('inp-title').value.trim();
  const company = document.getElementById('inp-company').value.trim();
  const industry = document.getElementById('inp-industry').value;
  const salary = document.getElementById('inp-salary').value.trim();
  const location = document.getElementById('inp-location').value.trim();
  const culture = document.getElementById('inp-culture').value.trim();
  const duties = document.getElementById('inp-duties').value.trim();
  const platforms = Array.from(document.querySelectorAll('.platform-chip.on')).map(el=>el.dataset.p);

  const info = `職位：${title}
${company?`公司：${company}`:''}
${industry?`產業：${industry}`:''}
${salary?`薪資：${salary}`:''}
${location?`地點：${location}`:''}
${culture?`公司文化：${culture}`:''}
${duties?`主要職責：${duties}`:''}`;

  HCLead.gate('tool-08', 'AI 招募文案生成器', {}, async function() {
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'block';

    const tabsEl = document.getElementById('tabs');
    const panelsEl = document.getElementById('panels');
    tabsEl.innerHTML = '';
    panelsEl.innerHTML = '';

    platforms.forEach((p, idx) => {
      const tab = document.createElement('div');
      tab.className = 'tab' + (idx===0?' active':'');
      tab.textContent = p;
      tab.onclick = () => switchTab(idx);
      tabsEl.appendChild(tab);

      const panel = document.createElement('div');
      panel.className = 'panel' + (idx===0?' active':'');
      panel.id = 'panel-'+idx;
      panel.innerHTML = `
        <div class="panel-head">
          <div class="panel-title">${p} 招募文案</div>
          <button class="btn-copy" onclick="copyPanel(${idx})">複製</button>
        </div>
        <div class="panel-body" id="body-${idx}"><div class="typing"><span></span><span></span><span></span></div></div>`;
      panelsEl.appendChild(panel);
    });

    for(const [idx, platform] of platforms.entries()) {
      const prompt = PLATFORM_PROMPTS[platform](info);
      const bodyEl = document.getElementById('body-'+idx);
      bodyEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

      try {
        const res = await fetch(`${API}/api/hr-health-check`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: prompt, sessionId: SESSION+'-'+idx })
        });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let txt = '';
        bodyEl.textContent = '';
        while(true) {
          const {done, value} = await reader.read();
          if(done) break;
          for(const line of decoder.decode(value,{stream:true}).split('\n')) {
            if(line.startsWith('data:')) {
              const d = line.slice(5).trim();
              if(d==='[DONE]') break;
              try { const t=JSON.parse(d).choices?.[0]?.delta?.content||''; txt+=t; bodyEl.textContent=txt; } catch(e){}
            }
          }
        }
      } catch(e) {
        bodyEl.textContent = 'AI 生成暫時失敗，請稍後再試。';
      }
    }

    const allText = platforms.map((p,i) => `=== ${p} ===\n${document.getElementById('body-'+i).textContent}`).join('\n\n---\n\n');
    HCLead.reportDone(allText);
  });
}

function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('active',i===idx));
}

function copyPanel(idx) {
  const txt = document.getElementById('body-'+idx).textContent;
  navigator.clipboard.writeText(txt).then(()=>{
    const btn = document.querySelectorAll('.btn-copy')[idx];
    btn.textContent='已複製！'; setTimeout(()=>btn.textContent='複製',2000);
  });
}

function restart() {
  document.getElementById('result-section').style.display='none';
  document.getElementById('form-section').style.display='block';
}
</script>
<script src="assets/hc-lead.js"></script>
</body>
</html>
