<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy-deep:#07142f;--navy:#10244c;--teal:#1d756f;--gold:#c9a15d;--gold-bright:#e2bf79;--ivory:#fbf8ef;--ink:#182036;--ink-soft:#5a6377;--ink-faded:#8b94a7;--line:rgba(16,36,76,0.12);--danger:#c34646}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--ivory);color:var(--ink);min-height:100vh}
a{text-decoration:none}
nav{background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);padding:14px clamp(20px,4vw,60px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(16,36,76,.07)}
.nav-brand{display:flex;align-items:center;gap:10px}.nav-brand img{height:40px}
.nav-brand span{font-family:'Noto Serif TC',serif;font-size:14px;font-weight:700;color:var(--navy)}
.nav-back{color:var(--ink-soft);font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid var(--line);transition:all .2s}
.nav-back:hover{background:var(--navy);color:#fff}
.page-header{background:linear-gradient(135deg,#0a2a1a,#1a5c3a,var(--teal));padding:48px clamp(20px,4vw,60px) 44px;text-align:center}
.tool-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(226,191,121,.15);border:1px solid rgba(226,191,121,.3);border-radius:999px;padding:5px 16px;font-size:12px;color:var(--gold-bright);font-weight:600;margin-bottom:16px}
.page-header h1{font-family:'Noto Serif TC',serif;font-size:clamp(22px,3.5vw,38px);font-weight:900;color:#fff;margin-bottom:10px}
.page-header p{color:rgba(255,255,255,.75);font-size:15px;max-width:560px;margin:0 auto}
.main{max-width:820px;margin:0 auto;padding:40px clamp(20px,4vw,40px) 80px}
.progress-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-bottom:24px}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.progress-label{font-size:13px;font-weight:700;color:var(--navy)}
.progress-count{font-size:13px;color:var(--ink-soft)}
.progress-bar{height:6px;background:rgba(16,36,76,.08);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:999px;transition:width .4s ease}
.dim-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.dim-pill{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600;transition:all .2s}
.dim-active{background:var(--navy);color:#fff}
.dim-done{background:rgba(29,117,111,.12);color:var(--teal)}
.dim-pending{background:rgba(16,36,76,.06);color:var(--ink-faded)}
.q-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:32px;margin-bottom:20px}
.q-dim{font-size:11px;font-weight:800;color:var(--teal);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.q-num{font-size:12px;color:var(--ink-faded);margin-bottom:12px}
.q-text{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--navy);line-height:1.65;margin-bottom:24px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 18px;border:2px solid var(--line);border-radius:8px;cursor:pointer;transition:all .2s}
.opt:hover{border-color:var(--gold);background:rgba(201,161,93,.05)}
.opt.selected{border-color:var(--navy);background:rgba(16,36,76,.04)}
.opt-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;position:relative;transition:all .2s}
.opt.selected .opt-radio{border-color:var(--navy);background:var(--navy)}
.opt.selected .opt-radio::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;border-radius:50%;background:#fff}
.opt-text{font-size:14.5px;color:var(--ink);line-height:1.5}
.nav-btns{display:flex;justify-content:space-between;gap:16px}
.btn-prev{background:#fff;border:2px solid var(--line);color:var(--ink-soft);padding:12px 24px;border-radius:8px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-prev:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
.btn-prev:disabled{opacity:.35;cursor:not-allowed}
.btn-next{background:var(--navy);color:#fff;padding:12px 28px;border-radius:8px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:background .2s}
.btn-next:hover:not(:disabled){background:var(--teal)}
.btn-next:disabled{opacity:.4;cursor:not-allowed}
#result-section{display:none}
.result-header{background:linear-gradient(135deg,#0a2a1a,var(--teal));border-radius:16px;padding:36px;text-align:center;margin-bottom:24px}
.result-header h2{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:900;color:#fff;margin-bottom:16px}
.overall-score{font-family:'Noto Serif TC',serif;font-size:72px;font-weight:900;color:var(--gold-bright);line-height:1}
.overall-level{font-size:16px;font-weight:800;color:var(--gold-bright);margin:10px 0 6px}
.overall-desc{font-size:13px;color:rgba(255,255,255,.65)}
.dim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-bottom:24px}
.dim-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}
.dim-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dim-name{font-size:14px;font-weight:700;color:var(--navy)}
.dim-score{font-family:'Noto Serif TC',serif;font-size:24px;font-weight:900}
.s-high{color:var(--teal)}.s-mid{color:var(--gold)}.s-low{color:#c34646}
.dim-bar-wrap{height:8px;background:rgba(16,36,76,.08);border-radius:999px;overflow:hidden;margin-bottom:8px}
.dim-bar{height:100%;border-radius:999px;transition:width 1s ease;width:0}
.b-high{background:linear-gradient(90deg,var(--teal),#3aaf8a)}
.b-mid{background:linear-gradient(90deg,var(--gold),var(--gold-bright))}
.b-low{background:linear-gradient(90deg,#c34646,#e05a5a)}
.dim-comment{font-size:12.5px;color:var(--ink-soft);line-height:1.7}
.ai-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:24px}
.ai-box-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ai-box-icon{width:36px;height:36px;background:var(--navy);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.ai-box-title{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:700;color:var(--navy)}
.ai-box-sub{font-size:12px;color:var(--ink-faded);margin-top:2px}
.ai-body{font-size:14px;color:var(--ink);line-height:2;white-space:pre-wrap;min-height:80px}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing span{width:6px;height:6px;background:var(--navy);border-radius:50%;animation:bounce .9s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
.cta-box{background:linear-gradient(135deg,var(--navy-deep),var(--navy));border-radius:12px;padding:28px;text-align:center}
.cta-box h3{font-family:'Noto Serif TC',serif;font-size:18px;color:#fff;font-weight:800;margin-bottom:8px}
.cta-box p{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:18px}
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-gold{background:var(--gold-bright);color:var(--navy-deep);padding:11px 24px;border-radius:8px;font-weight:800;font-size:14px}
.btn-ghost{border:1px solid rgba(255,255,255,.3);color:rgba(255,255,255,.85);padding:11px 20px;border-radius:8px;font-size:13px}
.btn-restart{display:block;margin:16px auto 0;background:#fff;border:2px solid var(--line);color:var(--ink);padding:10px 22px;border-radius:8px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.limit-msg{background:#fff0f0;border:1px solid #f5c0c0;border-radius:8px;padding:14px 18px;color:var(--danger);font-size:14px;line-height:1.7;text-align:center}
@media(max-width:560px){.dim-grid{grid-template-columns:1fr}}
</style>
</head>

  <a href="hr-health-center.html" class="nav-brand">

<div class="page-header">

  <h1>職業安全衛生合規健診</h1>
  <p>依《職業安全衛生法》五大面向，快速評估企業職安衛合規現況與風險缺口</p>
</div>
<div class="main">
  <div id="quiz-section">
    <div class="progress-wrap">
      <div class="progress-top">
        <span class="progress-label">診斷進度</span>
        <span class="progress-count" id="prog-count">第 1 題，共 20 題</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:5%"></div></div>
      <div class="dim-pills" id="dim-pills"></div>
    </div>
    <div class="q-card">
      <div class="q-dim" id="q-dim"></div>
      <div class="q-num" id="q-num"></div>
      <div class="q-text" id="q-text"></div>
      <div class="opts" id="q-opts"></div>
    </div>
    <div class="nav-btns">
      <button class="btn-prev" id="btn-prev" onclick="prevQ()">← 上一題</button>
      <button class="btn-next" id="btn-next" onclick="nextQ()" disabled>下一題 →</button>
    </div>
  </div>

  <div id="result-section">
    <div class="result-header">
      <h2>《職安衛合規診斷報告》</h2>
      <div class="overall-score" id="overall-score">—</div>
      <div class="overall-level" id="overall-level"></div>
      <div class="overall-desc">合規指數（滿分 100，建議達標 85 以上）</div>
    </div>
    <div class="dim-grid" id="dim-grid"></div>
    <div class="ai-box">
      <div class="ai-box-head">
        <div class="ai-box-icon">🤖</div>
        <div>
          <div class="ai-box-title">AI 職安衛合規分析報告</div>
          <div class="ai-box-sub">基於作答結果，由 AI 生成法遵風險與改善建議</div>
        </div>
      </div>
      <div class="ai-body" id="ai-body"><div class="typing"><span></span><span></span><span></span></div></div>
    </div>
    <div class="cta-box">
      <h3>需要職安衛制度建置支援？</h3>
      <p>策識永續協助企業建立符合法規的職安衛管理體系</p>
      <div class="cta-row">
        <a href="ai-hr-consultant.html" class="btn-gold">免費諮詢 AI 顧問</a>
        <a href="pricing-and-booking.html" class="btn-ghost">顧問服務方案</a>
      </div>
    </div>
    <button class="btn-restart" onclick="restart()">重新診斷</button>
  </div>
</div>

<script>
const API = 'https://cesi-hr-api-626216288020.asia-east1.run.app';
const SESSION = 'hc9-' + Math.random().toString(36).slice(2);

const DIMS = ['安全衛生政策','危害辨識與風險評估','安全衛生教育訓練','作業場所管理','緊急應變與事故處理'];

const QS = [
  // 安全衛生政策
  { dim:'安全衛生政策', text:'公司是否制定並公告職業安全衛生政策？', opts:['沒有任何政策','有但未公告','有政策並公告','有政策、公告並定期檢討'], sc:[1,2,3,4] },
  { dim:'安全衛生政策', text:'是否設置職業安全衛生委員會（30人以上公司法定必要）？', opts:['未設置且不知須設','知道要設但尚未設置','已設置但未定期開會','已設置且每季定期開會'], sc:[1,2,3,4] },
  { dim:'安全衛生政策', text:'是否依法配置職業安全衛生人員（職安人員或管理員）？', opts:['完全未配置','有名義負責人但無實質職能','已配置但未受訓','已配置且完成法定訓練'], sc:[1,2,3,4] },
  { dim:'安全衛生政策', text:'是否訂定自動檢查計畫並執行定期自動檢查？', opts:['無自動檢查計畫','有計畫但未執行','有執行但未留存紀錄','有計畫、執行且完整留存紀錄'], sc:[1,2,3,4] },
  // 危害辨識與風險評估
  { dim:'危害辨識與風險評估', text:'是否進行工作場所危害辨識與風險評估？', opts:['從未進行','曾做過但已過時','定期進行但未更新','定期進行且納入新作業/設備'], sc:[1,2,3,4] },
  { dim:'危害辨識與風險評估', text:'化學品是否建立安全資料表（SDS）並妥善管理？', opts:['沒有使用化學品或SDS','有化學品但無SDS','有SDS但未讓員工知悉','有SDS且員工可隨時取得'], sc:[1,2,3,4] },
  { dim:'危害辨識與風險評估', text:'機械設備是否定期檢查並維護保養紀錄完整？', opts:['無定期檢查','有檢查但無紀錄','有檢查有紀錄但不完整','完整檢查紀錄且按時執行'], sc:[1,2,3,4] },
  { dim:'危害辨識與風險評估', text:'是否對承攬商、外包人員進行安全管理？', opts:['無任何管理','有告知但無書面','有書面協議但未落實','有完整承攬管理制度'], sc:[1,2,3,4] },
  // 安全衛生教育訓練
  { dim:'安全衛生教育訓練', text:'新進員工是否接受職安衛一般安全衛生教育訓練？', opts:['沒有新人訓練','有口頭告知但無紀錄','有訓練但未留存紀錄','有訓練且完整留存紀錄'], sc:[1,2,3,4] },
  { dim:'安全衛生教育訓練', text:'特殊作業人員（如高空、化學、電氣等）是否取得法定資格？', opts:['不清楚法規要求','知道但員工未取得資格','部分員工已取得','所有相關人員均已取得法定資格'], sc:[1,2,3,4] },
  { dim:'安全衛生教育訓練', text:'是否對員工進行心理健康與職場霸凌防治教育？', opts:['從未進行','曾一次宣導','每年一次','定期且有實質課程內容'], sc:[1,2,3,4] },
  { dim:'安全衛生教育訓練', text:'主管人員是否接受職業安全衛生相關培訓？', opts:['未接受任何培訓','只有少數主管受訓','多數主管已受訓','全體主管完成法定訓練'], sc:[1,2,3,4] },
  // 作業場所管理
  { dim:'作業場所管理', text:'工作場所通道、逃生路線是否保持暢通並標示清楚？', opts:['有堆放雜物阻塞','部分通道受阻','通道暢通但標示不清','完全暢通且標示清晰'], sc:[1,2,3,4] },
  { dim:'作業場所管理', text:'是否提供適當的個人防護具（PPE）並確認員工正確使用？', opts:['未提供PPE','有提供但員工不使用','有提供且部分人員使用','有提供、訓練且落實使用'], sc:[1,2,3,4] },
  { dim:'作業場所管理', text:'工作場所噪音、溫度、照明等環境是否符合法規標準？', opts:['未監測且可能不合規','懷疑有問題但未改善','有監測但未完全符合','定期監測且符合法規'], sc:[1,2,3,4] },
  { dim:'作業場所管理', text:'電氣設備、線路是否定期檢查避免火災或電擊風險？', opts:['從未檢查','偶爾目視檢查','有定期目視但無專業檢測','定期專業檢測且紀錄完整'], sc:[1,2,3,4] },
  // 緊急應變與事故處理
  { dim:'緊急應變與事故處理', text:'是否制定緊急應變計畫並定期演練（至少每年一次）？', opts:['沒有任何計畫','有計畫但從未演練','有計畫且曾演練','有計畫且每年定期演練'], sc:[1,2,3,4] },
  { dim:'緊急應變與事故處理', text:'發生職業災害時，是否有標準的事故報告與調查流程？', opts:['沒有流程','有但員工不知道','員工知道但執行不一致','有完整流程且所有人清楚'], sc:[1,2,3,4] },
  { dim:'緊急應變與事故處理', text:'是否依法申報職業災害並與勞動單位保持聯繫？', opts:['不清楚申報義務','知道但曾漏報','有申報但程序不熟悉','完整申報且流程清楚'], sc:[1,2,3,4] },
  { dim:'緊急應變與事故處理', text:'近兩年是否發生職業災害或接受勞動檢查？', opts:['有嚴重災害且有缺失未改善','有輕傷事故尚在改善','曾接受檢查並完成改善','無災害紀錄且自主管理良好'], sc:[1,2,3,4] },
];

const TOTAL = QS.length;
let cur = 0, answers = new Array(TOTAL).fill(null);

function renderQ() {
  const q = QS[cur];
  document.getElementById('q-dim').textContent = q.dim;
  document.getElementById('q-num').textContent = `第 ${cur+1} 題`;
  document.getElementById('q-text').textContent = q.text;
  const optsEl = document.getElementById('q-opts');
  optsEl.innerHTML = '';
  q.opts.forEach((txt, i) => {
    const d = document.createElement('div');
    d.className = 'opt' + (answers[cur]===i?' selected':'');
    d.innerHTML = `<div class="opt-radio"></div><div class="opt-text">${txt}</div>`;
    d.onclick = () => select(i);
    optsEl.appendChild(d);
  });
  document.getElementById('prog-fill').style.width = Math.round(((cur+1)/TOTAL)*100)+'%';
  document.getElementById('prog-count').textContent = `第 ${cur+1} 題，共 ${TOTAL} 題`;
  document.getElementById('btn-prev').disabled = cur===0;
  document.getElementById('btn-next').disabled = answers[cur]===null;
  document.getElementById('btn-next').textContent = cur===TOTAL-1 ? '查看報告 →' : '下一題 →';
  renderPills();
}

function renderPills() {
  const el = document.getElementById('dim-pills');
  el.innerHTML = '';
  DIMS.forEach(d => {
    const idxs = QS.map((q,i)=>q.dim===d?i:-1).filter(i=>i>=0);
    const done = idxs.every(i=>answers[i]!==null);
    const active = QS[cur].dim===d;
    const span = document.createElement('span');
    span.className = 'dim-pill '+(active?'dim-active':done?'dim-done':'dim-pending');
    span.textContent = d;
    el.appendChild(span);
  });
}

function select(i) {
  answers[cur] = i;
  document.querySelectorAll('.opt').forEach((el,j)=>el.classList.toggle('selected',j===i));
  document.getElementById('btn-next').disabled = false;
}

function prevQ() { if(cur>0){cur--;renderQ();} }

function nextQ() {
  if(answers[cur]===null) return;
  if(cur<TOTAL-1){cur++;renderQ();return;}
  showResult();
}

function showResult() {
  const dimScores = {};
  DIMS.forEach(d=>{dimScores[d]={sum:0,max:0};});
  QS.forEach((q,i)=>{
    if(answers[i]!==null){
      dimScores[q.dim].sum += q.sc[answers[i]];
      dimScores[q.dim].max += 4;
    }
  });

  let totalSum = 0, totalMax = 0;
  DIMS.forEach(d=>{ totalSum+=dimScores[d].sum; totalMax+=dimScores[d].max; });
  const overall = Math.round((totalSum/totalMax)*100);
  const level = overall>=85?'低風險（合規良好）':overall>=60?'中風險（需改善）':'高風險（急需處理）';

  HCLead.gate('tool-09','AI 職安衛合規診斷',{score:overall,level}, function() {
    document.getElementById('quiz-section').style.display='none';
    document.getElementById('result-section').style.display='block';
    document.getElementById('overall-score').textContent = overall;
    const lvlEl = document.getElementById('overall-level');
    lvlEl.textContent = level;
    lvlEl.style.color = overall>=85?'#80ffcc':overall>=60?'var(--gold-bright)':'#ff8080';

    const grid = document.getElementById('dim-grid');
    grid.innerHTML='';
    DIMS.forEach(d=>{
      const ds = dimScores[d];
      const dpct = Math.round((ds.sum/ds.max)*100);
      const cls = dpct>=80?'s-high':dpct>=55?'s-mid':'s-low';
      const bcls = dpct>=80?'b-high':dpct>=55?'b-mid':'b-low';
      const lbl = dpct>=80?'合規良好':dpct>=55?'需要改善':'高度缺失';
      const card = document.createElement('div');
      card.className='dim-card';
      card.innerHTML=`
        <div class="dim-card-head"><span class="dim-name">${d}</span><span class="dim-score ${cls}">${dpct}</span></div>
        <div class="dim-bar-wrap"><div class="dim-bar ${bcls}" style="width:${dpct}%"></div></div>
        <div class="dim-comment">${lbl}（${dpct} 分）</div>`;
      grid.appendChild(card);
    });

    callAI(overall, level, dimScores);
  });
}

async function callAI(overall, level, dimScores) {
  const dimText = DIMS.map(d=>{
    const ds = dimScores[d];
    const dpct = Math.round((ds.sum/ds.max)*100);
    return `${d}：${dpct}分`;
  }).join('、');

  const prompt = `你是資深職安衛顧問，請根據以下企業職安衛合規診斷結果，提供專業法遵分析與改善建議。

整體合規指數：${overall}/100（${level}）
各面向分數：${dimText}

請提供：
1. 整體合規狀況評估
2. 最需優先改善的 2-3 個面向（含法規依據）
3. 具體改善行動清單（依緊急程度排序）
4. 若未改善可能面臨的法律責任（罰則、停工等）

請用繁體中文，引用職業安全衛生法相關條文，語氣專業且具體，約 400-500 字。`;

  const aiBody = document.getElementById('ai-body');
  aiBody.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

  try {
    const res = await fetch(`${API}/api/hr-health-check`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: prompt, sessionId: SESSION })
    });
    if(!res.ok||!res.body) throw new Error('API error');
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let txt = '';
    aiBody.textContent = '';
    while(true){
      const {done,value} = await reader.read();
      if(done) break;
      const chunk = decoder.decode(value,{stream:true});
      const lines = chunk.split('\n');
      for(const line of lines){
        if(line.startsWith('data:')){
          const d = line.slice(5).trim();
          if(d==='[DONE]') break;
          try{
            const j=JSON.parse(d);
            const t=j.choices?.[0]?.delta?.content||'';
            txt+=t; aiBody.textContent=txt;
          }catch(e){}
        }
      }
    }
    HCLead.reportDone(txt);
  } catch(e) {
    aiBody.textContent='AI 分析暫時無法取得，請稍後再試。';
  }
}

function restart() {
  cur=0; answers=new Array(TOTAL).fill(null);
  document.getElementById('result-section').style.display='none';
  document.getElementById('quiz-section').style.display='block';
  renderQ();
}

renderQ();
</script>
